[workspace]
members = [".", "applet-windows-swapper", "switcher-config"]
resolver = "2"

# Single source of truth for the release version. Bump this together with the newest
# <release> entry in applet/data/…metainfo.xml — the store shows the metainfo version,
# and .github/workflows/release.yml fails the release if the two disagree with the tag.
[workspace.package]
version = "0.1.7"

[package]
name = "cosmic-windows-swapper"
version.workspace = true
edition = "2024"

[[bin]]
name = "cosmic-windows-swapper"
path = "src/main.rs"

[dependencies]
libcosmic = { git = "https://github.com/pop-os/libcosmic", rev = "417923f", default-features = false, features = [
    "wayland",
    "tokio",
    "winit",
    "multi-window",
] }
# iced_runtime is already in the tree through libcosmic; we depend on it directly to send
# the `BlurSurface` platform action, which backs the real frosted-glass backdrop.
iced_runtime = { git = "https://github.com/pop-os/libcosmic", rev = "417923f", default-features = false, features = ["cctk"] }
cosmic-protocols = { git = "https://github.com/pop-os/cosmic-protocols", default-features = false, features = [
    "client",
], rev = "c253ec1" }
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
freedesktop-desktop-entry = "0.5"
memmap2 = "0.9"
libc = "0.2"
switcher-config = { path = "switcher-config" }

wayland-client = "0.31"

tokio      = { version = "1", features = ["net", "io-util"] }
clap       = { version = "4", features = ["derive"] }
anyhow     = "1"
log        = "0.4"
env_logger = "0.11"

[profile.release]
strip     = true
opt-level = "z"
lto       = true
codegen-units = 1
